    <meta name="description" content="نظام إدارة المتاجر والمخزون والمبيعات — واجهة التشغيل والمعاينة التفاعلية لإدارة المنتجات، الفئات، وسياق المتجر وقاعدة البيانات." />
    <meta property="og:title" content="Store Manager Pro" />
    <meta property="og:description" content="نظام إدارة المتاجر والمخزون والمبيعات — واجهة التشغيل والمعاينة التفاعلية لإدارة المنتجات، الفئات، وسياق المتجر وقاعدة البيانات." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#07182B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StoreManager" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('smp_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-slate-100 text-slate-800 dark:bg-[#07182B] dark:text-slate-100 font-['Cairo',sans-serif] antialiased selection:bg-[#159EAA] selection:text-white transition-colors duration-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
